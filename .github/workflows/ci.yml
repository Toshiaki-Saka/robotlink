name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SymPy (build-time code generation)
        run: python -m pip install --upgrade pip sympy

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      # Locate the executable across single- vs multi-config generators.
      - name: Run simulation (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f build/robot_sim ]; then
            ./build/robot_sim
          else
            ./build/${{ matrix.build_type }}/robot_sim
          fi

      - name: Run simulation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build\${{ matrix.build_type }}\robot_sim.exe) {
            & build\${{ matrix.build_type }}\robot_sim.exe
          } else {
            & build\robot_sim.exe
          }

      - name: Check that results were produced
        shell: bash
        run: test -s output/sim_results.csv

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-${{ matrix.os }}
          path: output/sim_results.csv
          if-no-files-found: error
